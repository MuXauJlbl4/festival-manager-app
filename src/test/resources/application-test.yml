spring:
  datasource:
    url: jdbc:h2:mem:festival-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yml

app:
  jwt:
    secret: test-secret-that-is-long-enough-for-hmac-sha-signing
    expiration-minutes: 30
